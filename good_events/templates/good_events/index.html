<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>好事花生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #fce4b8 0%, #f8d5a3 50%, #f0c27a 100%);
            background-attachment: fixed;
        }

        /* ===== 第一屏：祝福卡片 ===== */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        /* 飘落花生装饰 */
        .peanut {
            position: absolute;
            font-size: 2rem;
            user-select: none;
            opacity: 0.3;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0%   { transform: translateY(-10vh) rotate(0deg);  opacity: 0.4; }
            100% { transform: translateY(110vh) rotate(720deg); opacity: 0.1; }
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 60px 80px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15), 0 0 0 1px rgba(255, 255, 255, 0.5);
            text-align: center;
            position: relative;
            z-index: 1;
            backdrop-filter: blur(4px);
        }

        .card .icon {
            font-size: 4rem;
            margin-bottom: 16px;
            display: block;
        }

        .card h1 {
            font-size: 2.8rem;
            color: #8b4513;
            margin-bottom: 12px;
            letter-spacing: 6px;
        }

        .card .subtitle {
            font-size: 1.3rem;
            color: #a0522d;
            letter-spacing: 4px;
            margin-bottom: 8px;
        }

        .divider {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #d4a373, transparent);
            margin: 20px auto;
        }

        .wish {
            font-size: 1.6rem;
            color: #d2691e;
            font-weight: bold;
            letter-spacing: 2px;
            line-height: 1.6;
        }

        .wish em {
            font-style: normal;
            display: inline-block;
            animation: bounce 2s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-6px); }
        }

        .card footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #b8a088;
            letter-spacing: 1px;
        }

        /* ===== 下滑提示 V 形箭头 ===== */
        .scroll-hint {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            z-index: 2;
            animation: float 2s ease-in-out infinite;
        }

        .scroll-hint span {
            font-size: 0.8rem;
            color: #a08060;
            letter-spacing: 2px;
        }

        .chevron {
            width: 24px;
            height: 24px;
            border-right: 3px solid #a08060;
            border-bottom: 3px solid #a08060;
            transform: rotate(45deg);
            animation: chevron-bounce 2s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateX(-50%) translateY(0); }
            50%      { transform: translateX(-50%) translateY(8px); }
        }

        @keyframes chevron-bounce {
            0%, 100% { opacity: 0.4; }
            50%      { opacity: 1; }
        }

        /* ===== 第二屏：登录表单 ===== */
        .login-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 420px;
            max-width: 100%;
        }

        .login-card .login-icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }

        .login-card h2 {
            font-size: 1.8rem;
            color: #8b4513;
            margin-bottom: 4px;
            letter-spacing: 4px;
        }

        .login-card .login-sub {
            font-size: 0.9rem;
            color: #b8a088;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #8b4513;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8d5c4;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: #fefcf9;
        }

        .form-group input:focus {
            border-color: #d4a373;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d4a373, #c4956a);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.85;
        }

        .login-links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .login-links a {
            color: #c4956a;
            text-decoration: none;
            transition: color 0.3s;
        }

        .login-links a:hover {
            color: #8b4513;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- ===== 第一屏：祝福卡片 ===== -->
    <section class="hero" id="top">
        <div class="peanut" style="left: 5%;  animation-duration: 8s;  animation-delay: 0s;">🥜</div>
        <div class="peanut" style="left: 25%; animation-duration: 10s; animation-delay: 2s;">🥜</div>
        <div class="peanut" style="left: 45%; animation-duration: 7s;  animation-delay: 4s;">🥜</div>
        <div class="peanut" style="left: 65%; animation-duration: 11s; animation-delay: 1s;">🥜</div>
        <div class="peanut" style="left: 85%; animation-duration: 9s;  animation-delay: 3s;">🥜</div>

        <div class="card">
            <span class="icon">🥜</span>
            <h1>好事花生</h1>
            <p class="subtitle">🥜 · 🎋 · 🌸</p>
            <div class="divider"></div>
            <p class="wish"><em>祝你好事发生！</em></p>
            <footer>✦ 愿你每一天都有好事「花生」 ✦</footer>
        </div>

        <!-- 下滑 V 形提示 -->
        <a href="#login" class="scroll-hint">
            <div class="chevron"></div>
        </a>
    </section>

    <!-- ===== 第二屏：登录表单 ===== -->
    <section class="login-section" id="login">
        <div class="login-card">
            <span class="login-icon">🥜</span>
            <h2>好事花生</h2>
            <p class="login-sub">登录你的花生账号</p>

            <form method="post" action="/login/">
                <div class="form-group">
                    <label for="username">花生号</label>
                    <input type="text" id="username" name="username" placeholder="请输入花生号" />
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" name="password" placeholder="请输入密码" />
                </div>
                <button type="submit" class="btn-login">登 录</button>
            </form>

            <div class="login-links">
                <a href="/register/">没有账号？注册</a>
                <a href="/forgot-password/">忘记密码？</a>
            </div>
        </div>
    </section>

</body>
</html>
