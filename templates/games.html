{% extends "base.html" %}
{% load static %}

{% block title %}小游戏 - 好事花生{% endblock %}

{% block content %}
<main class="main">
    <h1 class="page-title">小游戏</h1>

    <div class="game-grid">
        {% for game in games %}
            <a class="game-card" href="{% url 'games:play' game.slug %}">
                <div class="game-cover">
                    <img src="{% static game.cover %}" alt="{{ game.title }}" loading="lazy" />
                </div>
                <div class="game-name">{{ game.title }}</div>
            </a>
        {% empty %}
            <p class="page-desc">还没有游戏，稍后再来看看。</p>
        {% endfor %}
    </div>
</main>
{% endblock %}

{% block extra_css %}
<style>
    /* 网格：方形封面 + 图下文字。加游戏不用动这里 —— 模板遍历 games.catalog.GAMES */
    .game-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 24px 20px;
        /* 顶部间距原本靠上面那句 .page-desc 的 margin-bottom 撑着，
           那句删掉后改挂在这里 */
        margin-top: 32px;
    }

    .game-card {
        display: block;
        color: var(--brown);
        text-decoration: none;
    }

    .game-cover {
        aspect-ratio: 1 / 1;
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: var(--cream);
        box-shadow: var(--shadow-sm);
        transition: transform 0.25s, box-shadow 0.25s;
    }

    .game-cover img {
        display: block;
        width: 100%;
        height: 100%;
        /* 换成非方形的真截图时也能自动裁切成方形，不会变形 */
        object-fit: cover;
    }

    .game-name {
        margin-top: 10px;
        text-align: center;
        font-size: 0.95rem;
        line-height: 1.5;
        transition: color 0.25s;
    }

    .game-card:hover .game-cover {
        transform: translateY(-4px);
        box-shadow: var(--shadow);
    }

    .game-card:hover .game-name {
        color: var(--caramel-dark);
    }
</style>
{% endblock %}
