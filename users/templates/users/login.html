{% extends "base.html" %}

{% block title %}登录 - 好事花生{% endblock %}

{% block content %}
<main class="main-centered">
    <div class="card card-narrow">
        <span class="icon">🥜</span>
        <h2>好事花生</h2>
        <p class="sub">登录你的花生账号</p>

        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label for="username">花生号</label>
                <input type="text" id="username" name="username" placeholder="请输入花生号" />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" />
            </div>
            <button type="submit" class="btn btn-primary">登 录</button>
        </form>

        <form method="post" action="{% url 'users:guest_login' %}">
            {% csrf_token %}
            <button type="submit" class="btn btn-ghost">游客登录</button>
        </form>

        <div class="links">
            <a href="{% url 'users:register' %}">没有账号？注册</a>
            <a href="{% url 'users:forgot_password' %}">忘记密码？</a>
        </div>
    </div>
</main>
{% endblock %}
