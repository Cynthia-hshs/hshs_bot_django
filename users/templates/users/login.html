<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>登录 - 好事花生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #fce4b8 0%, #f8d5a3 50%, #f0c27a 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 400px;
            max-width: 90vw;
        }

        .login-card .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }

        .login-card h1 {
            font-size: 1.8rem;
            color: #8b4513;
            margin-bottom: 4px;
            letter-spacing: 4px;
        }

        .login-card .sub {
            font-size: 0.9rem;
            color: #b8a088;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #8b4513;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8d5c4;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: #fefcf9;
        }

        .form-group input:focus {
            border-color: #d4a373;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d4a373, #c4956a);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.85;
        }

        .links {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
        }

        .links a {
            color: #c4956a;
            text-decoration: none;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #8b4513;
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b8a088;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: #8b4513;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <span class="icon">🥜</span>
        <h1>好事花生</h1>
        <p class="sub">登录你的花生账号</p>

        <form method="post">
            <div class="form-group">
                <label for="username">花生号</label>
                <input type="text" id="username" name="username" placeholder="请输入花生号" />
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" placeholder="请输入密码" />
            </div>
            <button type="submit" class="btn-login">登 录</button>
        </form>

        <div class="links">
            <a href="{% url 'users:register' %}">没有账号？注册</a>
            <a href="{% url 'users:forgot_password' %}">忘记密码？</a>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>
</body>
</html>
