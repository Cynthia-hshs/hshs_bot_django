<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设置密码 - 好事花生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #fce4b8 0%, #f8d5a3 50%, #f0c27a 100%);
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 420px;
            max-width: 90vw;
        }

        .card .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }

        .card h1 {
            font-size: 1.8rem;
            color: #8b4513;
            margin-bottom: 4px;
            letter-spacing: 4px;
        }

        .card .sub {
            font-size: 0.9rem;
            color: #b8a088;
            margin-bottom: 30px;
        }

        .step-indicator {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .step-indicator .step {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .step-indicator .step.done {
            background: #8b4513;
            color: #fff;
        }

        .step-indicator .step.active {
            background: #d4a373;
            color: #fff;
        }

        .step-indicator .line {
            width: 40px;
            height: 2px;
            background: #d4a373;
        }

        .step-indicator .line.done {
            background: #d4a373;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #8b4513;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8d5c4;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: #fefcf9;
        }

        .form-group input:focus {
            border-color: #d4a373;
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d4a373, #c4956a);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .btn-primary:hover {
            opacity: 0.85;
        }

        .hint {
            font-size: 0.8rem;
            color: #b8a088;
            margin-top: 6px;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b8a088;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: #8b4513;
        }

        .msg-box {
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .msg-box.success {
            display: block;
            background: #e8f5e9;
            color: #2e7d32;
        }

        .msg-box.error {
            display: block;
            background: #fce4ec;
            color: #c62828;
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 44px;
        }
    </style>
</head>
<body>
    <div class="card">
        <span class="icon">🥜</span>
        <h1>好事花生</h1>
        <p class="sub">设置密码</p>

        <!-- 步骤指示器 -->
        <div class="step-indicator">
            <div class="step done">✓</div>
            <div class="line done"></div>
            <div class="step active">2</div>
        </div>

        <!-- 提示信息（根据场景显示） -->
        <div class="msg-box" id="msgBox"></div>

        <form method="post" id="setPwdForm">
            <div class="form-group">
                <label for="password">设置密码</label>
                <input type="password" id="password" name="password" placeholder="至少 8 位，包含字母和数字" />
            </div>
            <div class="form-group">
                <label for="confirm_password">确认密码</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="再次输入密码" />
            </div>
            <p class="hint">* 密码至少 8 位，需包含字母和数字</p>
            <button type="submit" class="btn-primary">完 成</button>
        </form>

        <a href="{% url 'users:login' %}" class="back-link">← 返回登录</a>
    </div>

    <script>
        // 密码一致性即时校验
        document.getElementById('setPwdForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const pwd = document.getElementById('password').value;
            const confirm = document.getElementById('confirm_password').value;
            const msgBox = document.getElementById('msgBox');

            if (pwd.length < 8) {
                msgBox.className = 'msg-box error';
                msgBox.textContent = '密码至少 8 位';
                return;
            }
            if (!/[a-zA-Z]/.test(pwd) || !/[0-9]/.test(pwd)) {
                msgBox.className = 'msg-box error';
                msgBox.textContent = '密码需包含字母和数字';
                return;
            }
            if (pwd !== confirm) {
                msgBox.className = 'msg-box error';
                msgBox.textContent = '两次密码输入不一致';
                return;
            }
            msgBox.className = 'msg-box success';
            msgBox.textContent = '密码设置成功！（后端逻辑待实现）';
        });
    </script>
</body>
</html>
