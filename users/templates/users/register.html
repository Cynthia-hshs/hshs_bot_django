<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>注册 - 好事花生</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #fce4b8 0%, #f8d5a3 50%, #f0c27a 100%);
        }

        .register-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 50px 60px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
            width: 420px;
            max-width: 90vw;
        }

        .register-card .icon {
            font-size: 3rem;
            display: block;
            margin-bottom: 8px;
        }

        .register-card h1 {
            font-size: 1.8rem;
            color: #8b4513;
            margin-bottom: 4px;
            letter-spacing: 4px;
        }

        .register-card .sub {
            font-size: 0.9rem;
            color: #b8a088;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: #8b4513;
            margin-bottom: 6px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e8d5c4;
            border-radius: 12px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.3s;
            background: #fefcf9;
        }

        .form-group input:focus {
            border-color: #d4a373;
        }

        /* 邮箱 + 验证码按钮一行 */
        .input-row {
            display: flex;
            gap: 10px;
        }

        .input-row input {
            flex: 1;
        }

        .btn-code {
            flex-shrink: 0;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: #e8d5c4;
            color: #8b4513;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
            white-space: nowrap;
        }

        .btn-code:hover {
            background: #d4a373;
            color: #fff;
        }

        .btn-code:disabled {
            background: #ccc;
            color: #999;
            cursor: not-allowed;
        }

        .btn-register {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #d4a373, #c4956a);
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 4px;
            cursor: pointer;
            transition: opacity 0.3s;
            margin-top: 10px;
        }

        .btn-register:hover {
            opacity: 0.85;
        }

        .links {
            margin-top: 20px;
            font-size: 0.9rem;
        }

        .links a {
            color: #c4956a;
            text-decoration: none;
            transition: color 0.3s;
        }

        .links a:hover {
            color: #8b4513;
            text-decoration: underline;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #b8a088;
            text-decoration: none;
            font-size: 0.85rem;
        }

        .back-link:hover {
            color: #8b4513;
        }
    </style>
</head>
<body>
    <div class="register-card">
        <span class="icon">🥜</span>
        <h1>好事花生</h1>
        <p class="sub">注册新账号</p>

        <form method="post">
            <div class="form-group">
                <label for="email">邮箱</label>
                <div class="input-row">
                    <input type="email" id="email" name="email" placeholder="请输入邮箱地址" />
                    <button type="button" class="btn-code" id="btnGetCode">获取验证码</button>
                </div>
            </div>
            <div class="form-group">
                <label for="code">验证码</label>
                <input type="text" id="code" name="code" placeholder="请输入验证码" maxlength="6" />
            </div>
            <button type="submit" class="btn-register">注 册</button>
        </form>

        <div class="links">
            <a href="{% url 'users:login' %}">已有账号？立即登录</a>
        </div>

        <a href="/" class="back-link">← 返回首页</a>
    </div>

    <script>
        // 验证码倒计时（仅界面效果）
        document.getElementById('btnGetCode').addEventListener('click', function() {
            let seconds = 60;
            this.disabled = true;
            this.textContent = seconds + 's';

            const timer = setInterval(() => {
                seconds--;
                this.textContent = seconds + 's';
                if (seconds <= 0) {
                    clearInterval(timer);
                    this.disabled = false;
                    this.textContent = '获取验证码';
                }
            }, 1000);
        });
    </script>
</body>
</html>
